name: Build Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: workbench:test
      - name: Verify non-root data volume writes
        run: >-
          docker run --rm --read-only -v workbench-smoke:/app/data --entrypoint node workbench:test
          -e "import('./settings.mjs').then(async({Settings})=>{const s=new Settings('/app/data');await s.save('fake-ci-key');if(await s.key()!=='fake-ci-key')process.exit(1)})"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/canmingwei27-star/amazon-work-web:latest
            ghcr.io/canmingwei27-star/amazon-work-web:${{ github.sha }}
